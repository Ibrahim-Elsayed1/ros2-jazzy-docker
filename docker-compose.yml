services:
  ros2-jazzy:
    runtime: nvidia
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
    image: ibraa96/ros2-jazzykg:latest
    container_name: ros2_jazzy_kg
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=42
      - SHELL=/bin/zsh
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - __EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/10_nvidia.json
    volumes:

      # X11 socket for Gazebo & RViz2 GUIs
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Host folder (./ros2-ws) -> Container folder (/home/ibra/ros2-ws)
      - ./ros2-ws:/home/ibra/ros2-ws:rw
      # Host file (./.zsh_data) -> Container file (/home/ibra/.zsh_data)
      - ./.zsh_data:/home/ibra/.zsh_data:rw
    devices:
      # Pass through Intel/AMD integrated graphics on Linux
      - /dev/dri:/dev/dri
    group_add:
      - "44"
      - "110"
    command: sleep infinity